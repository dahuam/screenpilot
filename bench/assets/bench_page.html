<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ScreenPilot 基准页</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; background: #f7f8fa; }
  h1 { color: #1a4d8f; }
  section { background: #fff; border: 1px solid #d9dee5; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; max-width: 900px; }
  button { margin: 4px 8px 4px 0; padding: 6px 14px; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #b8c2cc; padding: 4px 12px; }
  a { color: #0b62c4; }
</style>
</head>
<body>
<h1>ScreenPilot 基准页（ScreenPilot Bench 固定内容）</h1>
<p>本页为识屏系统基准评测专用固定页面，内容不变、可复现，由 bench 场景通过本地 file:// 打开。</p>

<section id="sec-buttons">
  <h2>按钮区</h2>
  <button id="btn-alpha">提交订单</button>
  <button id="btn-beta">取消操作</button>
  <button id="btn-gamma">导出报表</button>
  <button id="btn-delta">刷新缓存</button>
</section>

<section id="sec-form">
  <h2>表单区</h2>
  <label for="user">用户名：</label>
  <input id="user" type="text" placeholder="请输入用户名">
  <label for="pass">密码：</label>
  <input id="pass" type="password" placeholder="请输入密码">
  <br>
  <input id="chk-mail" type="checkbox" checked> <span>订阅邮件通知</span>
  <input id="chk-sms" type="checkbox"> <span>订阅短信通知</span>
  <br>
  <input type="radio" name="plan" checked> <span>基础版</span>
  <input type="radio" name="plan"> <span>专业版</span>
  <input type="radio" name="plan"> <span>企业版</span>
  <br>
  <textarea id="memo" rows="2" cols="40">备注框：基准评测固定文本</textarea>
</section>

<section id="sec-table">
  <h2>表格区</h2>
  <table>
    <tr><th>城市</th><th>人口（万）</th><th>所属省份</th></tr>
    <tr><td>杭州</td><td>1220</td><td>浙江</td></tr>
    <tr><td>成都</td><td>2094</td><td>四川</td></tr>
    <tr><td>武汉</td><td>1373</td><td>湖北</td></tr>
  </table>
</section>

<section id="sec-links">
  <h2>链接与列表区</h2>
  <ul>
    <li>第一项：快速开始指南</li>
    <li>第二项：接口文档</li>
    <li>第三项：常见问题解答</li>
  </ul>
  <a href="#sec-buttons">回到按钮区</a> |
  <a href="#sec-form">回到表单区</a> |
  <a href="#sec-table">回到表格区</a>
</section>

<footer>ScreenPilot · 基准评测固定页 2026-10-25</footer>
</body>
</html>
